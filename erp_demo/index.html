<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ERP de démonstration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700&display=swap">
<style>
/* VOICE work: a back-office sales tool, sober and dense
   IDEA the order register of a small distributor's ERP: ruled ledgers, an import report like a printed log
   PICTURE the customer-orders register itself, with the freshly imported order marked
   COLOUR stone ground, black ink, white panels, brick for "new" and for rejections
   TYPE Schibsted Grotesk 700 for titles, Schibsted Grotesk for text
   LAYOUT laptop: left menu + register; phone: menu as a wrapping row above the register */
:root{color-scheme:light dark;--bg:light-dark(#e7e4df,#171513);--panel:light-dark(#ffffff,#221f1c);--ink:light-dark(#141210,#ece8e2);--soft:light-dark(#5d5750,#a9a199);--rule:light-dark(#d6d1ca,#3a3531);--head:light-dark(#f3f1ed,#1c1a17);--brick:light-dark(#c8371e,#ff7a5c);--brickbg:light-dark(#fbe7e2,#3a1d16);--ok:light-dark(#2e6b3a,#7fcf8f);--okbg:light-dark(#e5f1e7,#16301b)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Schibsted Grotesk',Arial,sans-serif;overflow-x:clip}
button,input,textarea{font:inherit;color:inherit}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px max(2vw,16px);background:var(--ink);color:var(--bg);flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;letter-spacing:-.01em}
.brand span{font-weight:400;opacity:.75;margin-left:10px}
.who{font-size:14px;opacity:.8}
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100% - 50px)}
nav{border-right:1px solid var(--rule);padding:18px 12px;display:flex;flex-direction:column;gap:2px;background:var(--head)}
nav a{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 12px;border-radius:4px;color:var(--ink);text-decoration:none;min-height:44px}
nav a:hover{background:var(--panel)}
nav a[aria-current=page]{background:var(--panel);font-weight:700;box-shadow:inset 3px 0 0 var(--ink)}
nav .count{font-size:13px;color:var(--soft);font-variant-numeric:tabular-nums}
nav .sep{margin:14px 12px 4px;font-size:13px;color:var(--soft)}
main{padding:24px max(3vw,16px) 48px}
h1{font-size:clamp(26px,3vw,34px);line-height:1.05;letter-spacing:-.02em;margin:0 0 4px}
.sub{color:var(--soft);margin:0 0 20px;max-width:70ch}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.btn{min-height:44px;padding:0 16px;border:1px solid var(--ink);background:var(--panel);border-radius:4px;cursor:pointer;font-weight:500}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn:hover{background:var(--head)}.btn.primary:hover{opacity:.88;background:var(--ink)}
.btn:focus-visible,nav a:focus-visible,textarea:focus-visible,tr[tabindex]:focus-visible{outline:2px solid var(--brick);outline-offset:2px}
.panel{background:var(--panel);border:1px solid var(--rule);border-radius:6px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{text-align:left;font-weight:500;color:var(--soft);font-size:13px;padding:10px 12px;border-bottom:2px solid var(--ink);background:var(--head);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;white-space:nowrap}
td.ref{font-weight:500;white-space:nowrap}
tbody tr[tabindex]{cursor:pointer}
tbody tr[tabindex]:hover td{background:var(--head)}
tr.sel td{background:var(--head)}
.tag{display:inline-block;padding:2px 8px;border-radius:3px;font-size:13px;white-space:nowrap;border:1px solid var(--rule)}
.tag.new{background:var(--brickbg);border-color:var(--brick);color:var(--brick);font-weight:700}
.tag.imp{border-color:var(--ink)}
.tag.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.tag.ko{background:var(--brickbg);border-color:var(--brick);color:var(--brick)}
.detail{margin-top:18px;padding:18px 20px}
.detail h2,.report h2{font-size:20px;margin:0 0 4px;letter-spacing:-.01em}
.meta{color:var(--soft);margin:0 0 14px;font-size:14px}
.tot td{font-weight:700;border-top:2px solid var(--ink)}
.drop{border:2px dashed var(--rule);border-radius:6px;background:var(--panel);padding:28px;display:grid;gap:12px;justify-items:start}
.drop.over{border-color:var(--brick);background:var(--brickbg)}
.drop p{margin:0}
textarea{width:100%;min-height:120px;border:1px solid var(--rule);border-radius:4px;background:var(--panel);padding:10px 12px;font-size:16px;font-family:ui-monospace,Menlo,monospace}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.report{margin-top:20px;padding:18px 20px}
.verdict{display:flex;gap:18px;flex-wrap:wrap;margin:10px 0 16px}
.verdict div{font-size:14px;color:var(--soft)}
.verdict b{display:block;font-size:28px;line-height:1.1;color:var(--ink)}
.verdict .bad b{color:var(--brick)}
.why{color:var(--brick);font-size:14px}
.report a{color:var(--ink);font-weight:700}
.empty{padding:28px;color:var(--soft)}
.note{font-size:13px;color:var(--soft);margin-top:14px}
.msg{min-height:22px;font-size:14px;color:var(--ok)}
.log td{font-size:14px}
@media(max-width:820px){.shell{grid-template-columns:minmax(0,1fr)}nav{flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--rule);padding:8px}nav .sep{display:none}nav a{padding:8px 12px}.cols{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){table{font-size:13px}th,td{padding:8px 6px}.hide-sm{display:none}}
@media(prefers-reduced-motion:no-preference){tr.flash td{animation:flash 1.6s ease-out}@keyframes flash{from{background:var(--brickbg)}to{background:transparent}}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">ERP de démonstration<span>Gestion commerciale</span></div>
  <div class="who">Distributeur Démo, poste ADV</div>
</header>
<div class="shell">
  <nav aria-label="Menu">
    <div class="sep">Ventes</div>
    <a href="#commandes" data-v="commandes">Commandes clients <span class="count" id="nOrders"></span></a>
    <a href="#import" data-v="import">Importer des commandes</a>
    <a href="#journal" data-v="journal">Journal des imports <span class="count" id="nLogs"></span></a>
    <div class="sep">Référentiel</div>
    <a href="#articles" data-v="articles">Articles <span class="count" id="nItems"></span></a>
  </nav>
  <main id="main"></main>
</div>
<script>
{
const KEY='erp-demo-v2';
const CATALOGUE=[
["18003", "Pied à coulisse becs croisés, vernier vissé, avec jauge, capacité 150 x 40 mm, lecture 1/20ème", "pce", 21.8, 64],

["462200", "Pied à coulisse digital boîtier métal, capacité 200 x 45 mm", "pce", 79.5, 65],
["FK70200", "Pied à coulisse digital qualité PRO, jauge plate standard, fourni avec certificat de conformité, capacité 200 x 45 mm", "pce", 88.0, 51],
["467200", "Pied à coulisse digital étanche IP67, capacité 200 x 45 mm", "pce", 16.96, 61],

["CR2032", "Piles 3 volts type CR2032, 5 piles", "lot de 5", 10.2, 105],
["15600", "Micromètre mécanique, capacité 0-25 mm", "pce", 17.13, 78],
["15625", "Micromètre mécanique, capacité 25-50 mm", "pce", 45.18, 123],
["15800", "Micromètre mécanique, capacité 100-125 mm", "pce", 96.0, 27],

["16980", "Support MBBV avec réglage fin, hauteur 230 mm, tige Ø12 mm, bras Ø10 mm, force d'attraction 80 Kg", "pce", 10.66, 31],
["16990", "Support haute qualité 100 kg, bras vertical Ø16 x 230 mm, bras horizontal Ø12 x 200 mm, force d'attraction 100 Kg", "pce", 41.91, 36],
["16901", "Support à serrage central, blocage des articulations par cames, rayon d'action 260 mm, force d'attraction 80 Kg", "pce", 72.56, 101],
["R17101", "Réglet inox chromé mat classe II, longueur 150 mm, section 13 x 0,5, gradué en mm et 1/2 mm sur 1 face", "lot de 10", 3.1, 96],
["R17102", "Réglet inox chromé mat classe II, longueur 200 mm, section 13 x 0,5, gradué en mm et 1/2 mm sur 1 face", "lot de 10", 74.8, 85],
["R17104", "Réglet inox chromé mat classe II, longueur 300 mm, section 13 x 0,5, gradué en mm et 1/2 mm sur 1 face", "lot de 10", 57.7, 55],
["R17002", "Réglet acier chromé mat classe II, double face, longueur 200 mm, section 13 x 0,5", "lot de 10", 37.9, 115],
["R17006", "Réglet inox chromé mat classe II, longueur 1000 mm, section 18 x 0,5", "pce", 22.0, 118],
["54100", "Equerre simple de mécanicien classe III, acier fraisé rectifié, dimensions 150 x 100 mm", "pce", 33.39, 24],
["T13004", "Equerre simple de précision classe II, acier fraisé rectifié, dimensions 150 x 100 mm", "pce", 39.96, 81],
["T13005", "Equerre simple de précision classe II, acier fraisé rectifié, dimensions 200 x 130 mm", "pce", 31.2, 82],
["FK13027", "Equerre simple classe I PRO, acier fraisé rectifié, chapeau vissé, dimensions 150 x 100 mm", "pce", 52.13, 98],
["K80055", "Feutre industriel pointe 0,8 mm, noir, boîte de 12 pièces", "lot de 12", 18.5, 69],
["K80052", "Feutre industriel pointe 0,8 mm, rouge, boîte de 12 pièces", "lot de 12", 49.68, 93],
["K70013", "Crayon de charpentier, longueur 30 cm, boîte de 12 pièces", "lot de 12", 96.89, 14],
["A18903", "Mesure roulante magnétique LockFlex, 3 M x 19 mm, vendu par 12 en boîte carton transformable en présentoir", "lot de 12", 142.0, 113],
["A18905", "Mesure roulante magnétique LockFlex, 5 M x 25 mm, vendu par 12 en boîte carton transformable en présentoir", "lot de 12", 9.8, 56],
["C17705", "Mesure roulante HiLock Tajima, 5 mètres, largeur ruban 25 mm", "pce", 6.9, 7],
["C17715", "Mesure roulante G LOCK Tajima, 5 mètres, largeur ruban 25 mm", "pce", 52.9, 55],
["C17710", "Mesure roulante G LOCK Tajima, 10 mètres, largeur ruban 25 mm", "pce", 83.04, 69],
["C17725", "Mesure G-3 LOCK magnétique Tajima, 5 mètres, largeur ruban 27 mm", "pce", 32.2, 25]
].map(([ref,lib,unit,price,stock])=>({ref,lib,unit,price,stock}));
const SAMPLE_ORDERS=[
{no:'CC-2026-0141',date:'2026-11-21',client:'Garage Ferrand',origin:'manual',lines:[['C17705',10],['A18905',2]]},
{no:'CC-2026-0142',date:'2026-11-23',client:'Lycée technique Jean-Moulin',origin:'manual',lines:[['15002',15],['15600',4],['R17102',3]]},
{no:'CC-2026-0143',date:'2026-11-24',client:'Ateliers Morel',origin:'manual',lines:[['469200',2],['16116',1]]},
{no:'CC-2026-0144',date:'2026-11-24',client:'Labo Pesée Ouest',origin:'manual',lines:[['FK70200',1],['CR2032',8]]}
];
const fresh=()=>({items:CATALOGUE.map(o=>({...o})),orders:SAMPLE_ORDERS.map(o=>({...o,lines:o.lines.map(([ref,qty])=>({ref,qty}))})),logs:[],seq:145,newNo:null,sel:null,report:null});
let S;
try{S=JSON.parse(localStorage.getItem(KEY))||fresh()}catch(e){S=fresh()}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur=n=>n.toLocaleString('fr-FR',{style:'currency',currency:'EUR'});
const nf=n=>Number.isInteger(n)?String(n):n.toLocaleString('fr-FR');
const dfr=d=>new Date(d+'T12:00').toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'});
const nref=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const item=ref=>S.items.find(i=>nref(i.ref)===nref(ref));
const total=o=>o.lines.reduce((t,l)=>t+(item(l.ref)?.price||0)*l.qty,0);
const $=id=>document.getElementById(id);

/* ---------- CSV ---------- */
const decode=buf=>{try{return new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){return new TextDecoder('windows-1252').decode(buf)}};
const splitRow=(line,sep)=>{const out=[];let cur='',q=false;for(let i=0;i<line.length;i++){const c=line[i];if(q){if(c=='"'&&line[i+1]=='"'){cur+='"';i++}else if(c=='"')q=false;else cur+=c}else if(c=='"')q=true;else if(c==sep){out.push(cur);cur=''}else cur+=c}out.push(cur);return out.map(s=>s.trim())};
const norm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
const SYN={ref:['codearticle','refarticle','ref','reference','sku','article','code','productcode','productref','itemcode','item','refcatalogue'],qty:['qte','qty','quantite','quantity','qt'],client:['codeclient','client','customer','nomclient','clientname'],order:['numerocommandeclient','numcommandeclient','numcde','numcommande','nocommande','commande','order','orderno','ordernumber','po','ponumber','numero'],unit:['unite','unit','uom'],lib:['libelle','designation','description','label']};
function parseCSV(text){
  const lines=text.replace(/^﻿/,'').split(/\r?\n/).filter(l=>l.trim());
  if(lines.length<2)throw new Error('Le fichier doit contenir une ligne d’en-tête et au moins une ligne de commande.');
  const h=lines[0];const sep=[';','\t',','].sort((a,b)=>h.split(b).length-h.split(a).length)[0];
  const head=splitRow(h,sep).map(norm);const col={};
  for(const k in SYN){const i=head.findIndex(c=>SYN[k].includes(c));if(i>=0)col[k]=i}
  if(col.ref==null||col.qty==null)throw new Error('Colonnes introuvables : il faut au moins une colonne article (CODE_ARTICLE, ref…) et une colonne quantité (QTE, qty…).');
  return lines.slice(1).map((l,i)=>{const r=splitRow(l,sep);const g=k=>col[k]!=null?(r[col[k]]||''):'';return{row:i+2,ref:g('ref'),qtyRaw:g('qty'),client:g('client'),order:g('order'),unit:g('unit'),lib:g('lib')}});
}
function importText(text,fileName){
  let rows;
  try{rows=parseCSV(text)}catch(e){S.report={error:e.message,file:fileName};save();render();return}
  const groups={};for(const r of rows){const k=(r.order||'SANS-NUMERO')+'|'+(r.client||'');(groups[k]=groups[k]||[]).push(r)}
  const created=[],rejected=[],skipped=[];let okLines=0;
  for(const k in groups){
    const g=groups[k];const ext=g[0].order;const client=g[0].client||'Client non renseigné';
    if(ext&&S.orders.some(o=>o.ext===ext&&o.client===client)){skipped.push({ext,client});continue}
    const lines=[];
    for(const r of g){
      const q=Number(String(r.qtyRaw).replace(',','.'));const it=item(r.ref);
      if(!r.ref){rejected.push({...r,why:'Référence article vide'});continue}
      if(!it){rejected.push({...r,why:'Article inconnu dans l’ERP'});continue}
      if(!(q>0)){rejected.push({...r,why:'Quantité invalide'});continue}
      lines.push({ref:it.ref,qty:q});it.stock=Math.max(0,it.stock-q);okLines++;
    }
    if(lines.length){const no='CC-2026-'+String(S.seq++).padStart(4,'0');S.orders.unshift({no,date:new Date().toISOString().slice(0,10),client,origin:'import',ext,file:fileName,lines});created.push(no)}
  }
  const rep={file:fileName,at:new Date().toISOString(),rows:rows.length,okLines,rejected,created,skipped};
  S.report=rep;S.logs.unshift({at:rep.at,file:fileName,rows:rows.length,ok:okLines,ko:rejected.length,created:created.slice(),skipped:skipped.length});
  S.newNo=created[0]||S.newNo;if(created[0])S.sel=created[0];save();render();
}

/* ---------- vues ---------- */
const views={
commandes(){
  const rows=S.orders.map(o=>`<tr tabindex="0" data-no="${esc(o.no)}" class="${o.no===S.sel?'sel':''}${o.no===S.newNo?' flash':''}">
    <td class="ref">${esc(o.no)}</td><td class="hide-sm">${esc(dfr(o.date))}</td><td>${esc(o.client)}</td>
    <td class="num">${o.lines.length}</td><td class="num">${esc(eur(total(o)))}</td>
    <td class="hide-sm">${o.origin==='import'?'<span class="tag imp">Import fichier</span>':'Saisie manuelle'}</td>
    <td>${o.no===S.newNo?'<span class="tag new">Nouvelle</span>':'<span class="tag">À préparer</span>'}</td></tr>`).join('');
  const o=S.orders.find(x=>x.no===S.sel);
  const det=o?`<section class="panel detail" aria-live="polite"><h2>Commande ${esc(o.no)}, ${esc(o.client)}</h2>
    <p class="meta">${esc(dfr(o.date))}, ${o.origin==='import'?'importée depuis '+esc(o.file||'un fichier')+(o.ext?', réf. client '+esc(o.ext):''):'saisie manuellement'}</p>
    <div class="scroll"><table><thead><tr><th>Article</th><th>Désignation</th><th class="num">Qté</th><th class="num hide-sm">PU HT</th><th class="num">Total HT</th></tr></thead><tbody>
    ${o.lines.map(l=>{const it=item(l.ref)||{lib:'?',price:0,unit:''};return`<tr><td class="ref">${esc(l.ref)}</td><td>${esc(it.lib)}</td><td class="num">${esc(nf(l.qty))} ${esc(it.unit)}</td><td class="num hide-sm">${esc(eur(it.price))}</td><td class="num">${esc(eur(it.price*l.qty))}</td></tr>`}).join('')}
    <tr class="tot"><td colspan="2">Total HT</td><td></td><td class="hide-sm"></td><td class="num">${esc(eur(total(o)))}</td></tr></tbody></table></div></section>`:'';
  return `<h1>Commandes clients</h1><p class="sub">Toutes les commandes du distributeur, saisies à la main ou importées depuis un fichier. Cliquez sur une commande pour voir ses lignes.</p>
  <div class="bar"><a class="btn primary" href="#import" style="display:inline-flex;align-items:center;text-decoration:none">Importer des commandes</a><button class="btn" id="reset">Réinitialiser la démo</button></div>
  <div class="panel scroll"><table><thead><tr><th>N° commande</th><th class="hide-sm">Date</th><th>Client</th><th class="num">Lignes</th><th class="num">Total HT</th><th class="hide-sm">Origine</th><th>Statut</th></tr></thead><tbody>${rows}</tbody></table></div>
  ${det}<p class="note">Données fictives : distributeur, clients, articles, prix et stocks sont inventés pour la démonstration.</p>`;
},
import(){
  const r=S.report;let rep='';
  if(r&&r.error)rep=`<section class="panel report" role="alert"><h2>Import refusé</h2><p class="meta">${esc(r.file)}</p><p class="why">${esc(r.error)}</p></section>`;
  else if(r){
    rep=`<section class="panel report" aria-live="polite"><h2>${r.created.length?'Commande créée':'Aucune commande créée'}</h2><p class="meta">Fichier ${esc(r.file)}, importé à ${esc(new Date(r.at).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}))}</p>
    <div class="verdict"><div><b>${r.okLines}</b>lignes importées</div><div class="${r.rejected.length?'bad':''}"><b>${r.rejected.length}</b>lignes rejetées</div><div><b>${r.created.length}</b>commande${r.created.length>1?'s':''} créée${r.created.length>1?'s':''}</div></div>
    ${r.created.map(no=>`<p><span class="tag ok">Créée</span> <a href="#commandes" data-open="${esc(no)}">${esc(no)}</a>, visible dans Commandes clients</p>`).join('')}
    ${r.skipped.map(s=>`<p><span class="tag ko">Ignorée</span> la commande ${esc(s.ext)} de ${esc(s.client)} a déjà été importée</p>`).join('')}
    ${r.rejected.length?`<div class="scroll"><table><thead><tr><th class="num">Ligne</th><th>Article</th><th class="num">Qté</th><th>Motif du rejet</th></tr></thead><tbody>${r.rejected.map(x=>`<tr><td class="num">${x.row}</td><td class="ref">${esc(x.ref||'(vide)')}</td><td class="num">${esc(x.qtyRaw)}</td><td class="why">${esc(x.why)}</td></tr>`).join('')}</tbody></table></div>`:''}
    </section>`;
  }
  return `<h1>Importer des commandes</h1><p class="sub">Déposez le fichier CSV produit par Ordo. L’ERP vérifie chaque ligne : l’article doit exister dans le référentiel et la quantité être valide. Les lignes correctes créent la commande, les autres sont rejetées avec leur motif.</p>
  <div class="cols"><div class="drop" id="drop"><p><b>Glissez le fichier d’import ici</b></p><p class="meta" style="margin:0">CSV séparé par ; ou , avec au moins une colonne article et une colonne quantité</p>
  <label class="btn primary" style="display:inline-flex;align-items:center">Choisir un fichier<input type="file" id="file" accept=".csv,.txt,text/csv" hidden></label></div>
  <div><label for="paste" class="meta" style="display:block;margin-bottom:6px">Ou collez le contenu du fichier</label><textarea id="paste" placeholder="numero_commande_client;client;reference;quantite&#10;260311;Atelier Martin;18003;5"></textarea>
  <div class="bar" style="margin-top:10px"><button class="btn" id="importPaste">Importer le texte collé</button></div></div></div>${rep}`;
},
journal(){
  const rows=S.logs.map(l=>`<tr><td class="hide-sm">${esc(new Date(l.at).toLocaleString('fr-FR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}))}</td><td>${esc(l.file)}</td><td class="num">${l.rows}</td><td class="num">${l.ok}</td><td class="num">${l.ko?`<span class="why">${l.ko}</span>`:'0'}</td><td>${l.created.map(esc).join(', ')||(l.skipped?'Déjà importée':'Aucune')}</td></tr>`).join('');
  return `<h1>Journal des imports</h1><p class="sub">Chaque fichier importé, avec ce qui a été accepté ou rejeté. C’est ici qu’on vérifie que les commandes d’Ordo sont bien arrivées dans l’ERP.</p>
  <div class="panel scroll">${rows?`<table class="log"><thead><tr><th class="hide-sm">Date</th><th>Fichier</th><th class="num">Lignes lues</th><th class="num">Importées</th><th class="num">Rejetées</th><th>Commande créée</th></tr></thead><tbody>${rows}</tbody></table>`:'<p class="empty">Aucun import pour l’instant. Importez un fichier depuis « Importer des commandes ».</p>'}</div>`;
},
articles(){
  const rows=S.items.map(i=>`<tr><td class="ref">${esc(i.ref)}</td><td>${esc(i.lib)}</td><td class="hide-sm">${esc(i.unit)}</td><td class="num">${esc(eur(i.price))}</td><td class="num">${esc(nf(i.stock))}</td></tr>`).join('');
  return `<h1>Articles</h1><p class="sub">Le référentiel articles de l’ERP. Ordo s’appuie sur ce catalogue : copiez-le en CSV et chargez-le dans Ordo pour que les références correspondent.</p>
  <div class="bar"><button class="btn primary" id="copyCat">Copier le catalogue en CSV</button><span class="msg" id="msg" role="status"></span></div>
  <div class="panel scroll"><table><thead><tr><th>Réf.</th><th>Désignation</th><th class="hide-sm">Unité</th><th class="num">Prix HT</th><th class="num">Stock</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}};

function render(){
  const v=views[location.hash.slice(1)]?location.hash.slice(1):'commandes';
  $('main').innerHTML=views[v]();
  document.querySelectorAll('nav a').forEach(a=>{if(a.dataset.v===v)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  $('nOrders').textContent=S.orders.length;$('nLogs').textContent=S.logs.length||'';$('nItems').textContent=S.items.length;
}
const readFile=f=>{if(!f)return;const r=new FileReader();r.onload=()=>importText(decode(new Uint8Array(r.result)),f.name);r.readAsArrayBuffer(f)};
document.addEventListener('click',e=>{
  const tr=e.target.closest('tr[data-no]');if(tr){S.sel=S.sel===tr.dataset.no?null:tr.dataset.no;save();render();return}
  const op=e.target.closest('[data-open]');if(op){S.sel=op.dataset.open;save()}
  if(e.target.id==='reset'){S=fresh();save();render()}
  if(e.target.id==='importPaste'){const t=$('paste').value.trim();if(t)importText(t,'texte collé')}
  if(e.target.id==='copyCat'){const csv='ref;designation;unite\n'+S.items.map(i=>[i.ref,i.lib,i.unit].join(';')).join('\n');
    navigator.clipboard.writeText(csv).then(()=>{$('msg').textContent='Catalogue copié : collez-le dans un fichier .csv pour Ordo.'},()=>{$('msg').textContent='Copie refusée par le navigateur.'})}
});
document.addEventListener('keydown',e=>{const tr=e.target.closest&&e.target.closest('tr[data-no]');if(tr&&(e.key==='Enter'||e.key===' ')){e.preventDefault();tr.click()}});
document.addEventListener('change',e=>{if(e.target.id==='file')readFile(e.target.files[0])});
document.addEventListener('dragover',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d){e.preventDefault();d.classList.add('over')}});
document.addEventListener('dragleave',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d)d.classList.remove('over')});
document.addEventListener('drop',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d){e.preventDefault();d.classList.remove('over');readFile(e.dataTransfer.files[0])}});
window.addEventListener('hashchange',render);
render();
}
</script>
</body>
</html>
